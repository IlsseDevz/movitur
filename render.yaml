services:
  - type: web
    name: movitur
    runtime: docker
    plan: free
    healthCheckPath: /api/categorias
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MOVITUR_JWT_SECRET
        generateValue: true
      - key: MOVITUR_ADMIN_EMAIL
        value: admin@movitur.co.mz
      - key: MOVITUR_ADMIN_SENHA
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: movitur-db
          property: connectionString
      - key: MOVITUR_MAIL_USER
        sync: false
      - key: MOVITUR_MAIL_PASS
        sync: false
      - key: MOVITUR_MAIL_FROM_NAME
        value: MoviTur

databases:
  - name: movitur-db
    databaseName: movitur
    user: movitur
    plan: free
