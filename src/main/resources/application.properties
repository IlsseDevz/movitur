spring.application.name=movitur-backend

# Base de dados PostgreSQL (persistente). Credenciais via movitur.env ou variaveis de ambiente.
spring.datasource.url=${MOVITUR_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/movitur}}
spring.datasource.driver-class-name=${MOVITUR_DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${MOVITUR_DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${MOVITUR_DB_PASS:${SPRING_DATASOURCE_PASSWORD:ILSSE0104}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:${MOVITUR_SERVER_PORT:8080}}

# ===== Upload de imagens =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
movitur.upload.dir=${MOVITUR_UPLOAD_DIR:uploads}

# ===== Email =====
movitur.mail.from-name=${MOVITUR_MAIL_FROM_NAME:MoviTur}
spring.thymeleaf.check-template-location=true

# ===== JWT =====
# Chave secreta em Base64 (>= 256 bits). Em producao, definir via variavel de ambiente MOVITUR_JWT_SECRET.
movitur.jwt.secret=${MOVITUR_JWT_SECRET:bW92aXR1ci1zdXBlci1zZWNyZXQta2V5LXBhcmEtZGVzZW52b2x2aW1lbnRvLTIwMjY=}
# Validade do token em milissegundos (24 horas)
movitur.jwt.expiration-ms=86400000

# URL base da aplicacao (usada em links de email)
movitur.app.url=${MOVITUR_APP_URL:http://localhost:3000}

# ===== Admin inicial (criado no arranque se nao existir) =====
movitur.admin.email=${MOVITUR_ADMIN_EMAIL:admin@movitur.co.mz}
movitur.admin.senha=${MOVITUR_ADMIN_SENHA:admin123}
movitur.admin.nome=Administrador MoviTur

# ===== Email (Gmail SMTP) =====
# Preencher via variaveis de ambiente (ver movitur.env.example):
#   MOVITUR_MAIL_USER = o seu email @gmail.com
#   MOVITUR_MAIL_PASS = a "App Password" de 16 digitos gerada na conta Google
# Enquanto estiver vazio, os emails NAO sao enviados (apenas registados no log).
#
# Por defeito usa a porta 465 (SSL implicito), que costuma funcionar mesmo quando
# o STARTTLS da porta 587 e bloqueado por antivirus/inspecao SSL na rede.
# Para voltar a 587/STARTTLS: MOVITUR_MAIL_PORT=587, MOVITUR_MAIL_SSL=false, MOVITUR_MAIL_STARTTLS=true
spring.mail.host=${MOVITUR_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MOVITUR_MAIL_PORT:465}
spring.mail.username=${MOVITUR_MAIL_USER:}
spring.mail.password=${MOVITUR_MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MOVITUR_MAIL_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MOVITUR_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.trust=${MOVITUR_MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
