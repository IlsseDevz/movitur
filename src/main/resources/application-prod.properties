# Perfil de producao (spring.profiles.active=prod)
spring.datasource.url=${MOVITUR_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/movitur}}
spring.datasource.username=${MOVITUR_DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${MOVITUR_DB_PASS:${SPRING_DATASOURCE_PASSWORD:1804}}

spring.datasource.hikari.maximum-pool-size=5

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

logging.level.org.hibernate.SQL=WARN
logging.level.com.movitur=INFO

server.error.include-message=never
server.error.include-stacktrace=never